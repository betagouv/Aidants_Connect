<bar-line-chart
  x="{{ chart.x }}"
  y-bar="{{ chart.y_bar }}"
  y-line="{{ chart.y_line }}"
  name-bar="Évolution du mois"
  name-line="{{ chart.name_line|escape }}"
  y-bar-min="0"
  y-line-min="0"
  aspect-ratio="{{ chart.aspect_ratio|escape }}"
  aria-label="{{ aria_label|escape }}"
></bar-line-chart>
